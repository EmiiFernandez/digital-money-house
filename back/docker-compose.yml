        condition: service_healthy
    networks:
      - back_network
    ports:
      - "8086:8086"
    environment:
      - SERVER_PORT=8086
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M

